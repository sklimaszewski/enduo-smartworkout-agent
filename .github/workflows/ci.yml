# Tests and type check on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 22.18 is the oldest Node that runs the TypeScript sources as they are; the image runs 26.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: shellcheck bin/enduo-smartworkout

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t enduo-smartworkout-agent:ci .
      - name: Smoke test
        run: |
          # It has to start, wait for its setup and count as healthy without any sign-in.
          docker run -d --name smoke enduo-smartworkout-agent:ci
          sleep 10
          docker logs smoke
          docker exec smoke enduo-smartworkout health
          docker logs smoke 2>&1 | grep -q 'enduo-smartworkout setup'
          docker stop smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0
